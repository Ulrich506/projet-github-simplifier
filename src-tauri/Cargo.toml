[package]
name = "github-simplifie"
version = "0.1.0"
description = "Publier et synchroniser des projets GitHub sans ligne de commande"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
keyring = "4"

[lib]
name = "github_simplifie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
