name: Build and release installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à créer (ex. v0.1.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release (${{ matrix.platform }})
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    continue-on-error: ${{ matrix.platform == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage,rpm
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg

    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag invalide : $RELEASE_TAG (format attendu : vX.Y.Z)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Gsimplifié ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Installeurs Gsimplifié pour Linux, Windows et macOS (selon la disponibilité du build).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Linux Debian package
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Gsimplifie-${{ inputs.tag || github.ref_name }}-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Gsimplifie-${{ inputs.tag || github.ref_name }}-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux RPM package
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Gsimplifie-${{ inputs.tag || github.ref_name }}-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows NSIS installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Gsimplifie-${{ inputs.tag || github.ref_name }}-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows MSI installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Gsimplifie-${{ inputs.tag || github.ref_name }}-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS disk image
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Gsimplifie-${{ inputs.tag || github.ref_name }}-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish-workflow-artifacts:
    name: Attach workflow artifacts to GitHub Release
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: Gsimplifie-${{ inputs.tag || github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Impossible de déterminer le tag de la release."
            exit 1
          fi

          if [[ ! -d release-assets ]]; then
            echo "Aucun artifact d’installation n’a été téléchargé."
            exit 1
          fi

          found_asset=false
          while IFS= read -r -d '' asset; do
            found_asset=true
            gh release upload "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done < <(find release-assets -type f -print0)

          if [[ "$found_asset" != true ]]; then
            echo "Les artifacts téléchargés ne contiennent aucun fichier à publier."
            exit 1
          fi
